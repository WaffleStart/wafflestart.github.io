<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Chart</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/type-chart.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">

<body>
    <header>
        <h1><a href="index.html">PPokémon Database</a></h1>
        <nav>
            <ul>
                <li><a href="pokedex.html">Pokédex</a></li>
                <li><a href="emulator.html">Emulator</a></li>
                <li><a href="type-chart.html">Type Chart</a></li>
                <li><a href="weakness-analyzer.html">Weakness Analyzer</a></li>
                <li><a href="team-builder.html">Team Builder</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="type-chart">
            <h2>Type Effectiveness</h2>
            <table>
                <thead>
                    <tr>
                        <th>Attack↓ \ Defense→</th>
                        <th class="type normal">Normal</th>
                        <th class="type fire">Fire</th>
                        <th class="type water">Water</th>
                        <th class="type electric">Electric</th>
                        <th class="type grass">Grass</th>
                        <th class="type ice">Ice</th>
                        <th class="type fighting">Fighting</th>
                        <th class="type poison">Poison</th>
                        <th class="type ground">Ground</th>
                        <th class="type flying">Flying</th>
                        <th class="type psychic">Psychic</th>
                        <th class="type bug">Bug</th>
                        <th class="type rock">Rock</th>
                        <th class="type ghost">Ghost</th>
                        <th class="type dragon">Dragon</th>
                        <th class="type dark">Dark</th>
                        <th class="type steel">Steel</th>
                        <th class="type fairy">Fairy</th>
                    </tr>
                </thead>
                <tbody id="type-chart-body">
                    <!-- Type matchups will be filled dynamically -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Pokémon Fan Database</p>
    </footer>
    <script defer src="js/type-chart.js"></script>
</body>
</html>
